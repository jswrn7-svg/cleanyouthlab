<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a70"><title>청춘클린랩 | 현장·고객관리</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">靑</div><div><strong id="brandName">청춘클린랩</strong><small>현장 · 고객 통합관리</small></div></div><nav id="nav"></nav><div class="sidefoot">오프라인 로컬 데이터 · v1.0</div></aside><main><header><div><div class="eyebrow">OPERATIONS CENTER</div><h1 id="pageTitle">대시보드</h1></div><div class="header-actions"><span id="today"></span><button class="btn primary" id="quickAdd">+ 현장 등록</button></div></header><div id="content"></div></main></div>
<div class="mobile-nav" id="mobileNav"></div><dialog id="editor"><form id="editorForm"><div class="dialogHead"><h2 id="editorTitle">등록</h2><button type="button" class="x" id="closeDialog">✕</button></div><div id="editorFields" class="fields"></div><div class="dialogActions"><button type="button" class="btn" id="cancelDialog">취소</button><button type="submit" class="btn primary">저장하기</button></div></form></dialog><dialog id="shareDialog"><div class="sharebody"><div class="dialogHead"><h2>고객 공유 링크</h2><button class="x" type="button" onclick="document.getElementById('shareDialog').close()">✕</button></div><p id="shareSiteTitle"></p><p class="detail">링크 생성 시점의 작업 내용만 전달됩니다. 실시간 연동이 아니며 링크에 개인정보를 넣지 마세요.</p><textarea id="shareLink" readonly rows="5"></textarea><div class="quick"><button class="btn primary" id="copyShare" type="button">링크 복사</button><button class="btn" id="nativeShare" type="button">갤럭시 공유</button><button class="btn" id="previewShare" type="button">고객 화면 미리보기</button></div></div></dialog><input type="file" id="importFile" accept="application/json" hidden><div id="toast" role="status"></div><script>document.addEventListener('DOMContentLoaded',()=>{const get=()=>document.getElementById('shareLink').value;document.getElementById('copyShare').onclick=async()=>{try{await navigator.clipboard.writeText(get());alert('링크를 복사했습니다.')}catch{document.getElementById('shareLink').select();alert('링크를 선택했습니다. 복사해 주세요.')}};document.getElementById('nativeShare').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'청춘클린랩 현장 작업 현황',url:get()});else document.getElementById('copyShare').click()}catch(e){if(e.name!=='AbortError')alert('공유할 수 없습니다. 링크 복사를 사용하세요.')}};document.getElementById('previewShare').onclick=()=>window.open(get(),'_blank','noopener');});</script><script src="./app.js" defer></script></body></html>
